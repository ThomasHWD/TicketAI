services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - documents_storage:/app/storage
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://user:test@postgres:5432/ticketai_db
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
      - valkey

  worker_ingestion:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_ingestion -c 2 -l info
    volumes:
      - ./backend:/app
      - documents_storage:/app/storage
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://user:test@postgres:5432/ticketai_db
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
    depends_on:
      - postgres
      - qdrant
      - valkey

  worker_questions:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_questions -c 4 -l info
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://user:test@postgres:5432/ticketai_db
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on:
      - postgres
      - qdrant
      - valkey

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
