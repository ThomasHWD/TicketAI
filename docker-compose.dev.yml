name: ticketai-dev

x-infra-healthcheck: &infra-healthcheck
  interval: 10s
  start_interval: 1s
  timeout: 5s
  retries: 10
  start_period: 10s

# inspect ping traverse le broker — distingue « process up » de « worker consomme encore » ; -d cible CE nœud ($$HOSTNAME = $HOSTNAME au shell).
x-celery-healthcheck: &celery-healthcheck
  test:
    [
      "CMD-SHELL",
      "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null 2>&1",
    ]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

# Infra sur 127.0.0.1 : Qdrant et Valkey sans auth — 0.0.0.0 exposerait le corpus et la file au réseau local.
x-infra-deps: &infra-deps
  postgres:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  valkey:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"',
        ]
      <<: *infra-healthcheck

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6335:6333"
      - "127.0.0.1:6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      <<: *infra-healthcheck

  valkey:
    image: valkey/valkey:7.2-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *infra-healthcheck

  backend:
    build: ./backend
    # Une seule ligne : en bloc YAML replié, les \n sur-indentés arrivent au sh -c et tronquent watchmedo sans argument. exec = SIGTERM direct.
    command: ["sh", "-c", "alembic upgrade head && exec watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - ./backend:/app
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
    ports:
      - "8000:8000"
    depends_on: *infra-deps
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker_ingestion:
    build: ./backend
    command: watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- celery -A app.workers.celery_app worker -Q queue_ingestion -c 2 -l info
    volumes:
      - ./backend:/app
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
    depends_on: *infra-deps
    healthcheck: *celery-healthcheck

  worker_questions:
    build: ./backend
    command: watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- celery -A app.workers.celery_app worker -Q queue_questions -c 4 -l info
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on: *infra-deps
    healthcheck: *celery-healthcheck

  worker_beat:
    build: ./backend
    # --schedule hors de /app : beat écrit le schedule dans le WORKDIR par défaut, donc dans le dépôt bind-monté, en root.
    command: watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- celery -A app.workers.celery_app beat -l info --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - ./backend:/app
      - beat_schedule:/var/lib/celery
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on: *infra-deps
    # Pas de healthcheck : beat ne répond pas à inspect ping ; sa mort fait sortir le conteneur, restart: le relance.

  frontend:
    image: node:22-alpine
    working_dir: /app
    # npm install à chaque démarrage (29 s) ; --prefer-offline/--no-audit/--no-fund économisent réseau et logs ; exec = SIGTERM direct à vite.
    command: ["sh", "-c", "npm install --prefer-offline --no-audit --no-fund && exec npm run dev -- --host"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Sans ce volume, le cache npm meurt à chaque recréation et tout repart du registre.
      - npm_cache:/root/.npm
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  documents_storage:
  uploads_tmp:
  npm_cache:
  beat_schedule:
