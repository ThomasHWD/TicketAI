# Dépendances d'infra communes aux services applicatifs.
# Les ancres YAML ne traversent pas la frontière `-f base -f dev`, d'où une
# définition par fichier.
x-infra-deps: &infra-deps
  postgres:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  valkey:
    condition: service_healthy

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://user:test@postgres:5432/ticketai_db
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
    ports:
      - "8000:8000"
    depends_on: *infra-deps
    healthcheck:
      # curl (installé dans backend/Dockerfile) plutôt qu'un `python -c` : ~5 ms
      # contre ~111 ms par sonde, et plus de triple niveau d'échappement.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker_ingestion:
    build: ./backend
    command: watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- celery -A app.workers.celery_app worker -Q queue_ingestion -c 2 -l info
    volumes:
      - ./backend:/app
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://user:test@postgres:5432/ticketai_db
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
    depends_on: *infra-deps

  worker_questions:
    build: ./backend
    command: watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- celery -A app.workers.celery_app worker -Q queue_questions -c 4 -l info
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://user:test@postgres:5432/ticketai_db
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on: *infra-deps

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    # Volontairement PAS `condition: service_healthy` : Vite proxifie /api/v1
    # paresseusement à chaque requête, il n'a aucune dépendance au boot. Gater
    # dessus empêchait tout travail front dès que le backend ne démarrait pas,
    # et sérialisait le `npm install` derrière la santé du backend.
    depends_on:
      - backend

volumes:
  documents_storage:
  uploads_tmp:
