services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://user:test@postgres:5432/ticketai_db
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker_ingestion:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_ingestion -c 2 -l info
    volumes:
      - ./backend:/app
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://user:test@postgres:5432/ticketai_db
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker_questions:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_questions -c 4 -l info
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://user:test@postgres:5432/ticketai_db
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  documents_storage:
  uploads_tmp:
