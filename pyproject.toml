[tool.ruff]
# On augmente la taille max des lignes à 120 (standard moderne plus confortable)
line-length = 120
target-version = "py311"

# Nouvelle syntaxe recommandée par Ruff pour les règles de linting
[tool.ruff.lint]
select = [
    "E",   # Erreurs de style (pycodestyle)
    "W",   # Avertissements de style (pycodestyle)
    "F",   # Erreurs de logique (Pyflakes)
    "I",   # Tri des imports (isort)
    "B",   # Prévention des bugs (flake8-bugbear)
    "C4",  # Optimisation des compréhensions (flake8-comprehensions)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# On ignore certaines règles spécifiques dans les fichiers de tests si besoin
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Couverture activée par défaut (rapport, sans seuil bloquant pour l'instant : on
# veut la visibilité, pas casser les PR en plein dev). Un `--cov-fail-under` pourra
# être ajouté plus tard une fois la couverture stabilisée.
addopts = "--cov=app --cov-report=term-missing"
markers = [
    "integration: nécessite une infra réelle (Postgres/Valkey/Qdrant) ; auto-skippé en local sans infra",
    "albert: consomme du quota Albert (embedding/LLM) ; grouper pour maîtriser les appels par journée",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]