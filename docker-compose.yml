services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketAI-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: ticketAI-qdrant
    restart: always
    ports:
      - "${QDRANT_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: ticketAI-valkey
    restart: always
    ports:
      - "${VALKEY_PORT}:6379"

volumes:
  postgres_data:
  qdrant_data:
