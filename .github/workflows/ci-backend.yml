name: CI Backend

on:
  push:
    branches: [main, "dev"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, "dev"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

  # Tests (suite complète : unitaires + intégration)
  # GitHub Actions est l'environnement de référence pour les tests d'intégration :
  # Postgres et Valkey sont provisionnés en services, Qdrant en conteneur. La base
  # `ticketai_test` déclenche l'exécution réelle des tests marqués `integration`
  # (cf. garde-fou dans backend/tests/conftest.py).
  tests:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Start Qdrant DB
        run: |
          docker run -d -p 6333:6333 -p 6334:6334 qdrant/qdrant

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz > /dev/null; then
              echo "Qdrant prêt."; exit 0
            fi
            echo "Attente de Qdrant ($i)..."; sleep 2
          done
          echo "Qdrant n'a pas démarré à temps"; exit 1

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: ticketai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          VALKEY_HOST: localhost
          VALKEY_PORT: 6379
          VALKEY_URL: redis://localhost:6379/0
          LLM_URL: http://localhost:8000
          LLM_MODEL_NAME: mock-model
          DOCUMENTS_STORAGE_PATH: ./test_storage_dir
          ALBERT_API_KEY: "mock_key_for_tests"
          ALBERT_LLM_URL: "https://localhost/v1"
          ALBERT_LLM_MODEL_NAME: "mock-llm"
          ALBERT_EMBEDDINGS_URL: "https://localhost/v1"
          ALBERT_EMBEDDINGS_MODEL_NAME: "mock-embeddings"
          ALBERT_RERANKER_URL: "https://localhost/v1/rerank"
          ALBERT_RERANKER_MODEL_NAME: "mock-reranker"
          PYTHONPATH: .
        working-directory: backend
        run: pytest
