name: TicketAI CI/CD Pipeline

on:
  push:
    branches: [main, "dev"]
  pull_request:
    branches: [main, "dev"]

jobs:
  # Analyse du code
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

  # Tests unitaires
  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        env:
            POSTGRES_HOST: localhost
            POSTGRES_DB: ticketai_test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            QDRANT_HOST: localhost
            QDRANT_PORT: 6333
            VALKEY_HOST: localhost
            VALKEY_PORT: 6379
            VALKEY_URL: redis://localhost:6379/0
            LLM_URL: http://localhost:8000
            LLM_MODEL_NAME: mock-model
        working-directory: backend
        run: pytest
