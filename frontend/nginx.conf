server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip pour les assets texte
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Écrasé, pas complété ($proxy_add_x_forwarded_for) : uvicorn fait confiance à cet en-tête, un client
        # qui l'enverrait lui-même choisirait son IP — et donc son compteur de login.
        # Sans lui, tous les clients avaient l'IP de ce conteneur : 11 mauvais mots de passe bloquaient tout le monde.
        # Si un reverse-proxy s'intercale un jour devant nginx, $remote_addr devient le sien : passer à real_ip_header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sans cette règle, /health tombe dans le fallback SPA ci-dessous et renvoie
    # index.html en 200 : une sonde de supervision externe resterait au vert
    # alors que le backend est totalement HS.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    # Assets Vite : noms avec hash → cache navigateur longue durée
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
