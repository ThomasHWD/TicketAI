server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Hérités par chaque location… sauf celles qui posent leur propre add_header (cf. /assets/).
    # Le JWT vit en localStorage : sans CSP, une seule XSS suffirait à le voler. script-src sans 'unsafe-inline'
    # → aucun <script> inline dans index.html (cf. public/theme-init.js). Styles inline tolérés (attributs style).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # HSTS à ajouter le jour où le site passe en HTTPS — pas avant, il ne s'applique qu'en TLS.

    # Compression gzip pour les assets texte
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sans cette règle, /health tombe dans le fallback SPA ci-dessous et renvoie
    # index.html en 200 : une sonde de supervision externe resterait au vert
    # alors que le backend est totalement HS.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Seule route qui reçoit des fichiers : le plafond par défaut (1 Mo) y refusait tout document > 1 Mo en 413,
    # alors que le backend en accepte 50 (MAX_SIZE_MB). Ailleurs il reste à 1 Mo — le backend lit le corps entier.
    location /api/v1/documents {
        client_max_body_size 50m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    # Assets Vite : noms avec hash → cache navigateur longue durée
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
