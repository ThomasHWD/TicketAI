server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sans cette règle, /health tombe dans le fallback SPA ci-dessous et renvoie
    # index.html en 200 : une sonde de supervision externe resterait au vert
    # alors que le backend est totalement HS.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
