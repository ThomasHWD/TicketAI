<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      #tk-preloader { position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px;font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;transition:opacity .4s ease; }
      #tk-preloader.tk-hide { opacity:0;pointer-events:none; }
      @keyframes tk-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes tk-antenna{0%,100%{transform:scale(.6);opacity:0}15%{opacity:.9}70%{opacity:0}100%{transform:scale(2.6);opacity:0}}
      @keyframes tk-tip{0%,100%{opacity:.55;filter:drop-shadow(0 0 2px #2FE272)}50%{opacity:1;filter:drop-shadow(0 0 8px #2FE272)}}
      @keyframes tk-eyeon{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
      @keyframes tk-blink{0%,42%,48%,92%,100%{transform:scaleY(1)}45%,90.5%{transform:scaleY(.08)}}
      @keyframes tk-scan{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(26px);opacity:0}}
      @keyframes tk-ticket{0%{transform:translateX(-14px);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(16px);opacity:0}}
      @keyframes tk-code{0%,100%{opacity:.35}50%{opacity:.85}}
      @keyframes tk-rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes tk-shimmer{0%{background-position:-140% 0}60%,100%{background-position:220% 0}}
      @keyframes tk-glide{0%{left:-40%}100%{left:100%}}
      @keyframes tk-dot{0%,100%{opacity:.25}50%{opacity:1}}
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
          window.__TK_THEME__ = t;
        } catch (e) { window.__TK_THEME__ = "dark"; }
      })();
    </script>
  </head>
  <body>
    <div id="tk-preloader"></div>
    <div id="root"></div>
    <script>
      (function() {
        var dark = (window.__TK_THEME__ || "dark") === "dark";
        var c = dark
          ? { bg:"#071310", glow:"rgba(47,226,114,0.12)", body:"#168B46", edge:"#0f6c37", text:"#eafff2", sub:"#7fe0a6", track:"rgba(47,226,114,0.14)" }
          : { bg:"#F8FAFC", glow:"rgba(47,226,114,0.16)", body:"#168B46", edge:"#1E8543", text:"#112F21", sub:"#1E8543", track:"rgba(17,47,33,0.10)" };

        window.__TK_START__ = Date.now();
      var el = document.getElementById("tk-preloader");
        el.style.background = c.bg;
        el.innerHTML = `
          <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 42%,${c.glow} 0%,transparent 70%);pointer-events:none;"></div>

          <div style="position:relative;animation:tk-float 4.2s ease-in-out infinite;">
            <svg width="190" height="238" viewBox="0 0 190 238" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible;">
              <g style="transform-box:fill-box;transform-origin:center;">
                <circle cx="95" cy="20" r="9" fill="none" stroke="#2FE272" stroke-width="2" style="transform-box:fill-box;transform-origin:center;animation:tk-antenna 2.6s ease-out infinite;"></circle>
                <circle cx="95" cy="20" r="9" fill="none" stroke="#2FE272" stroke-width="2" style="transform-box:fill-box;transform-origin:center;animation:tk-antenna 2.6s ease-out infinite;animation-delay:1.3s;"></circle>
              </g>
              <line x1="95" y1="46" x2="95" y2="26" stroke="${c.edge}" stroke-width="4" stroke-linecap="round"></line>
              <circle cx="95" cy="20" r="6" fill="#2FE272" style="animation:tk-tip 1.6s ease-in-out infinite;"></circle>
              <rect x="46" y="44" width="98" height="72" rx="22" fill="${c.body}"></rect>
              <rect x="46" y="44" width="98" height="72" rx="22" fill="none" stroke="${c.edge}" stroke-width="2" opacity="0.4"></rect>
              <g style="transform-box:fill-box;transform-origin:center;animation:tk-eyeon .7s ease-out both,tk-blink 5s ease-in-out 1s infinite;">
                <circle cx="77" cy="82" r="11" fill="#0d2417"></circle>
                <circle cx="77" cy="82" r="7" fill="#2FE272" style="filter:drop-shadow(0 0 6px #2FE272);"></circle>
                <circle cx="80" cy="79" r="2.4" fill="#eafff2"></circle>
                <circle cx="113" cy="82" r="11" fill="#0d2417"></circle>
                <circle cx="113" cy="82" r="7" fill="#2FE272" style="filter:drop-shadow(0 0 6px #2FE272);"></circle>
                <circle cx="116" cy="79" r="2.4" fill="#eafff2"></circle>
              </g>
              <rect x="82" y="104" width="26" height="5" rx="2.5" fill="#2FE272" opacity="0.5"></rect>
              <rect x="86" y="116" width="18" height="10" fill="${c.edge}"></rect>
              <rect x="24" y="132" width="16" height="52" rx="8" fill="${c.edge}"></rect>
              <rect x="150" y="132" width="16" height="52" rx="8" fill="${c.edge}"></rect>
              <rect x="40" y="126" width="110" height="86" rx="20" fill="${c.body}"></rect>
              <rect x="40" y="126" width="110" height="86" rx="20" fill="none" stroke="${c.edge}" stroke-width="2" opacity="0.4"></rect>
              <rect x="54" y="140" width="82" height="58" rx="10" fill="#06140d"></rect>
              <rect x="54" y="140" width="82" height="58" rx="10" fill="none" stroke="#2FE272" stroke-width="1.5" opacity="0.35"></rect>
              <clipPath id="tkScreen"><rect x="54" y="140" width="82" height="58" rx="10"></rect></clipPath>
              <g clip-path="url(#tkScreen)">
                <line x1="63" y1="150" x2="98" y2="150" stroke="#2FE272" stroke-width="2" stroke-linecap="round" style="animation:tk-code 1.8s ease-in-out infinite;"></line>
                <line x1="63" y1="158" x2="118" y2="158" stroke="#2FE272" stroke-width="2" stroke-linecap="round" style="animation:tk-code 1.8s ease-in-out infinite;animation-delay:.3s;"></line>
                <line x1="63" y1="166" x2="88" y2="166" stroke="#2FE272" stroke-width="2" stroke-linecap="round" style="animation:tk-code 1.8s ease-in-out infinite;animation-delay:.6s;"></line>
                <g style="transform-box:fill-box;transform-origin:center;animation:tk-ticket 2.4s cubic-bezier(.6,0,.3,1) infinite;">
                  <rect x="63" y="176" width="18" height="14" rx="3" fill="none" stroke="#2FE272" stroke-width="2"></rect>
                  <line x1="83" y1="183" x2="108" y2="183" stroke="#2FE272" stroke-width="2.5" stroke-linecap="round"></line>
                  <path d="M103 178 L110 183 L103 188" fill="none" stroke="#2FE272" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                </g>
                <rect x="54" y="142" width="82" height="16" fill="#2FE272" opacity="0.16" style="animation:tk-scan 2.4s ease-in-out infinite;"></rect>
              </g>
              <rect x="62" y="212" width="18" height="22" rx="7" fill="${c.edge}"></rect>
              <rect x="110" y="212" width="18" height="22" rx="7" fill="${c.edge}"></rect>
            </svg>
          </div>

          <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
            <div style="animation:tk-rise .8s ease-out .3s both;">
              <span style="font-size:52px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(100deg,${c.text} 0%,${c.text} 38%,#2FE272 50%,${c.text} 62%,${c.text} 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:tk-shimmer 3.4s ease-in-out 1s infinite;">TicketAI</span>
            </div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:${c.sub};padding-left:.42em;animation:tk-rise .8s ease-out .55s both;">Automatisation Intelligente</div>
          </div>

          <div style="display:flex;flex-direction:column;align-items:center;gap:14px;animation:tk-rise .8s ease-out .8s both;">
            <div style="position:relative;width:220px;height:3px;border-radius:99px;background:${c.track};overflow:hidden;">
              <div style="position:absolute;top:0;bottom:0;width:40%;border-radius:99px;background:linear-gradient(90deg,transparent,#2FE272,#2FE272,transparent);box-shadow:0 0 12px #2FE272;animation:tk-glide 1.6s cubic-bezier(.5,0,.5,1) infinite;"></div>
            </div>
            <div style="display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:${c.sub};opacity:.7;">
              <span style="width:5px;height:5px;border-radius:50%;background:#2FE272;animation:tk-dot 1.2s ease-in-out infinite;"></span>
              Chargement du système
            </div>
          </div>
        `;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
