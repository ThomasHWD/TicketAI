name: ticketai

# json-file sans plafond = disque plein = démon Docker entier tombé ; 3×10 Mo par service. À ajouter à tout nouveau service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-infra-healthcheck: &infra-healthcheck
  interval: 10s
  start_interval: 1s
  timeout: 5s
  retries: 10
  start_period: 10s

# inspect ping traverse le broker : un worker qui a perdu Valkey reste « Up » sans ce check.
x-celery-healthcheck: &celery-healthcheck
  test:
    [
      "CMD-SHELL",
      "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null 2>&1",
    ]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-infra-deps: &infra-deps
  postgres:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  valkey:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"',
        ]
      <<: *infra-healthcheck

  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: always
    logging: *logging
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      <<: *infra-healthcheck

  valkey:
    image: valkey/valkey:7.2-alpine
    restart: always
    logging: *logging
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *infra-healthcheck

  backend:
    build: ./backend
    # --forwarded-allow-ips='*' : le port 8000 n'est pas publié, seul nginx (qui écrase X-Forwarded-For) joint uvicorn.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"]
    volumes:
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
      # Remplacer avant déploiement : ALLOWED_ORIGINS: '["https://ticketai.mon-entreprise.fr"]'
    depends_on: *infra-deps
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker_ingestion:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_ingestion -c 2 -l info
    volumes:
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
    depends_on: *infra-deps
    restart: unless-stopped
    logging: *logging
    healthcheck: *celery-healthcheck

  worker_questions:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_questions -c 4 -l info
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on: *infra-deps
    restart: unless-stopped
    logging: *logging
    healthcheck: *celery-healthcheck

  worker_beat:
    build: ./backend
    # --schedule hors de /app : le code n'a pas besoin d'être inscriptible par l'utilisateur non privilégié.
    command: celery -A app.workers.celery_app beat -l info --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - beat_schedule:/var/lib/celery
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on: *infra-deps
    restart: unless-stopped
    logging: *logging
    # Pas de healthcheck : beat ne répond pas à inspect ping ; sa mort fait sortir le conteneur, restart: le relance.

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      start_interval: 1s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  qdrant_data:
  documents_storage:
  uploads_tmp:
  beat_schedule:
