name: ticketai

x-infra-healthcheck: &infra-healthcheck
  interval: 10s
  start_interval: 1s
  timeout: 5s
  retries: 10
  start_period: 10s

x-infra-deps: &infra-deps
  postgres:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  valkey:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"',
        ]
      <<: *infra-healthcheck

  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      <<: *infra-healthcheck

  valkey:
    image: valkey/valkey:7.2-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *infra-healthcheck

  backend:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    volumes:
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
      # Remplacer par l'URL publique avant déploiement, ex :
      # ALLOWED_ORIGINS: '["https://ticketai.mon-entreprise.fr"]'
    depends_on: *infra-deps
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker_ingestion:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_ingestion -c 2 -l info
    volumes:
      - documents_storage:/app/storage
      - uploads_tmp:/app/uploads_tmp
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
      UPLOAD_DIR: /app/uploads_tmp
    depends_on: *infra-deps
    restart: unless-stopped

  worker_questions:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_questions -c 4 -l info
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on: *infra-deps
    restart: unless-stopped

  worker_beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat -l info
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on: *infra-deps
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      start_interval: 1s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  qdrant_data:
  documents_storage:
  uploads_tmp:
