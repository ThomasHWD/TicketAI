# Dépendances d'infra communes aux services applicatifs.
# Les ancres YAML ne traversent pas la frontière `-f base -f prod`, d'où une
# définition par fichier.
x-infra-deps: &infra-deps
  postgres:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  valkey:
    condition: service_healthy

services:
  backend:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    volumes:
      - documents_storage:/app/storage
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
    depends_on: *infra-deps
    restart: unless-stopped
    healthcheck:
      # curl (installé dans backend/Dockerfile) plutôt qu'un `python -c` : ~5 ms
      # contre ~111 ms par sonde, et plus de triple niveau d'échappement.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      start_interval: 1s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker_ingestion:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_ingestion -c 2 -l info
    volumes:
      - documents_storage:/app/storage
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
      DOCUMENTS_STORAGE_PATH: /app/storage
    depends_on: *infra-deps
    restart: unless-stopped

  worker_questions:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q queue_questions -c 4 -l info
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on: *infra-deps
    restart: unless-stopped

  worker_beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat -l info
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      VALKEY_HOST: valkey
    depends_on: *infra-deps
    restart: unless-stopped

  # Nginx embarqué dans l'image frontend (multi-stage build)
  # Sert le build React ET proxie /api vers backend
  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    # service_started et non service_healthy : nginx n'a besoin que de résoudre
    # le nom `backend` au chargement de sa conf. Gater sur la santé transformait
    # toute panne backend en panne totale — le port 80 n'était jamais ouvert,
    # donc même le shell statique devenait injoignable au lieu de servir la SPA
    # avec des 502 sur /api.
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      start_interval: 1s
      timeout: 5s
      retries: 3
      start_period: 10s
